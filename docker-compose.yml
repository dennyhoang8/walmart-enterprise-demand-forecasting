services:

  # ============================================================
  # POSTGRESQL
  # Main project database
  # ============================================================

  postgres:
    image: postgres:17
    container_name: walmart_postgres
    hostname: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # AIRFLOW INITIALIZATION
  # Sets up Airflow database and admin user
  # ============================================================

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    container_name: walmart_airflow_init
    hostname: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "walmart-airflow-secret-key-2026"

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}

      FRED_API_KEY: ${FRED_API_KEY}

      PYTHONPATH: /opt/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Denny \
          --lastname User \
          --role Admin \
          --email admin@example.com || true


  # ============================================================
  # AIRFLOW WEBSERVER
  # Airflow dashboard
  # ============================================================

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    container_name: walmart_airflow_webserver
    hostname: airflow-webserver
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "walmart-airflow-secret-key-2026"

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}

      FRED_API_KEY: ${FRED_API_KEY}

      PYTHONPATH: /opt/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data

    ports:
      - "8080:8080"

    command: airflow webserver


  # ============================================================
  # AIRFLOW SCHEDULER
  # Runs scheduled Airflow jobs
  # ============================================================

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    container_name: walmart_airflow_scheduler
    hostname: airflow-scheduler
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "walmart-airflow-secret-key-2026"

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}

      FRED_API_KEY: ${FRED_API_KEY}

      PYTHONPATH: /opt/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data

    command: airflow scheduler


  # ============================================================
  # FASTAPI
  # Serves demand forecasts and pricing recommendations
  # ============================================================

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api

    container_name: walmart_api
    hostname: api
    restart: unless-stopped

    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # STREAMLIT
  # User-facing forecasting and pricing dashboard
  # ============================================================

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit

    container_name: walmart_streamlit
    hostname: streamlit
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    environment:
      API_BASE_URL: http://api:8000

    ports:
      - "8501:8501"


# ============================================================
# PERSISTENT VOLUMES
# Keeps PostgreSQL data even when containers are restarted
# ============================================================

volumes:
  postgres_data: