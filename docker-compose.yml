services:

  # =========================================================
  # PostgreSQL Database
  # =========================================================

  postgres:
    image: postgres:17
    container_name: walmart_postgres
    hostname: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================================================
  # Airflow Initialization
  # =========================================================

  airflow-init:
    image: apache/airflow:2.10.5
    container_name: walmart_airflow_init
    hostname: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "walmart-airflow-secret-key-2026"
      FRED_API_KEY: ${FRED_API_KEY}
      PYTHONPATH: /opt/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Denny \
          --lastname User \
          --role Admin \
          --email admin@example.com || true


  # =========================================================
  # Airflow Webserver
  # =========================================================

  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: walmart_airflow_webserver
    hostname: airflow-webserver
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "walmart-airflow-secret-key-2026"
      FRED_API_KEY: ${FRED_API_KEY}
      PYTHONPATH: /opt/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data

    ports:
      - "8080:8080"

    command: airflow webserver


  # =========================================================
  # Airflow Scheduler
  # =========================================================

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: walmart_airflow_scheduler
    hostname: airflow-scheduler
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "walmart-airflow-secret-key-2026"
      FRED_API_KEY: ${FRED_API_KEY}
      PYTHONPATH: /opt/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data

    command: airflow scheduler


# =========================================================
# Volumes
# =========================================================

volumes:
  postgres_data: